<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Single Skill Architecture</title><style>html,body{margin:0;height:100%;display:grid;place-items:center;background:#eef1f5;color:#161b22;font-family:system-ui,sans-serif}</style></head><body>Carregando apresentação…<script>Promise.all(['b64-part-01.txt','b64-part-02.txt','b64-part-03.txt','b64-part-04.txt','b64-part-05.txt'].map(p=>fetch(p).then(r=>{if(!r.ok)throw new Error(p);return r.text()}))).then(parts=>{const b64=parts.join('');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}).then(html=>{document.open();document.write(html);document.close()}).catch(err=>{document.body.textContent='Não foi possível carregar a apresentação: '+err.message})</script></body></html>
