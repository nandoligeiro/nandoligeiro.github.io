<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skill Monorepo Architecture</title><style>html,body{margin:0;height:100%;display:grid;place-items:center;background:#0c0f14;color:#fff;font-family:system-ui,sans-serif}body{font-size:16px}</style></head><body>Carregando apresentação…<script>Promise.all(['part-01.txt','part-02.txt','part-03.txt'].map(p=>fetch(p).then(r=>{if(!r.ok)throw new Error(p);return r.text()}))).then(parts=>{const layout='<style id="three-zone-layout">.content{display:grid!important;grid-template-rows:auto auto minmax(0,1fr);align-content:stretch!important;gap:8px!important;padding:18px 22px 14px!important}.content>.eyebrow{align-self:start}.content>h1,.content>h2{align-self:start}.content-body{min-height:0;display:grid;align-content:center;gap:clamp(16px,2.5vh,28px);width:100%}.content-body>.grid,.content-body>.flow,.content-body>.table,.content-body>.term,.content-body>.formula{width:100%}.content-body>.grid>.card{height:100%;display:grid;align-content:center}.content-body>.grid.cols2,.content-body>.grid.cols3,.content-body>.grid.cols4{align-items:stretch}.content[style*="justify-items:center"]{grid-template-rows:auto auto minmax(0,1fr)!important;justify-items:center!important;text-align:center!important}.content[style*="justify-items:center"] .content-body{justify-items:center;text-align:center;align-content:center}.content[style*="justify-items:center"] .content-body>.grid{width:100%;max-width:1180px}@media(max-width:1100px){.content{display:block!important;padding:16px 22px 12px!important;overflow:auto}.content>*+*{margin-top:14px}.content-body{display:grid;align-content:start;gap:14px;margin-top:14px}}</style>';const enhancer='<script id="three-zone-enhancer">document.querySelectorAll(".content").forEach(c=>{if(c.querySelector(":scope > .content-body"))return;const kids=[...c.children];const titleIndex=kids.findIndex(el=>/^(H1|H2)$/.test(el.tagName));if(titleIndex<0||titleIndex===kids.length-1)return;const body=document.createElement("div");body.className="content-body";kids.slice(titleIndex+1).forEach(el=>body.appendChild(el));c.appendChild(body)});<\/script>';const html=parts.join('').replace('Skill = workflow · Shared script = reutilização','Skill = workflow · shared = reutilização controlada').replace('<b>shared/assets/</b> locais','<b>assets/</b> locais').replace('</head>',layout+'</head>').replace('</body>',enhancer+'</body>');document.open();document.write(html);document.close()}).catch(err=>{document.body.textContent='Não foi possível carregar a apresentação: '+err.message})</script></body></html>
