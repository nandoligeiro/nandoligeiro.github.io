<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skill Monorepo Architecture</title><style>html,body{margin:0;height:100%;display:grid;place-items:center;background:#080b10;color:#fff;font-family:system-ui,sans-serif}body{font-size:16px}</style></head><body>Carregando apresentação…<script>Promise.all(['part-01.txt','part-02.txt','part-03.txt'].map(p=>fetch(p).then(r=>{if(!r.ok)throw new Error(p);return r.text()}))).then(parts=>{const subagentSlide=`<section><div class="slide"><div class="topbar"><div class="brand"><span class="dot"></span><span class="name">Subagents</span></div><div class="meta"><span class="chip">Delegação e especialização</span></div></div><div class="content"><div class="eyebrow">Camada acima das skills</div><h2>O monorepo também pode organizar capacidades usadas por subagents especializados.</h2><p class="subtitle">Skill é unidade de execução reutilizável. Subagent é unidade de delegação com escopo próprio.</p><div class="flow"><div class="node"><div class="n1">Parent Agent</div><div class="n2">Coordena o objetivo global</div></div><div class="arrow">→</div><div class="node"><div class="n1">Subagent</div><div class="n2">Resolve uma parte especializada</div></div><div class="arrow">→</div><div class="node"><div class="n1">Skill</div><div class="n2">Define como executar</div></div><div class="arrow">→</div><div class="node"><div class="n1">shared/</div><div class="n2">Scripts, referências e assets reutilizáveis</div></div></div><div class="grid cols2"><div class="card green"><div class="label">Onde o monorepo ajuda</div><p class="body">Subagents diferentes podem consumir as mesmas skills e componentes shared sem copiar implementação. Ex.: architecture-reviewer, contract-reviewer e observability-reviewer.</p></div><div class="card red"><div class="label">Cuidado</div><p class="body">Não transforme cada skill em subagent. Delegue apenas quando especialização, paralelismo ou isolamento de contexto compensarem o custo de coordenação.</p></div></div><div class="formula">Hierarquia útil: <b>Agent → Subagent → Skill → shared components → Tool/Runtime</b>.</div></div><div class="footer"><span>Delegação usa skills; não substitui skills</span><span class="page">13</span></div><aside class="speaker"><b>Nota:</b> explicar que o monorepo continua organizado por capacidades. Subagents são consumidores/orquestradores dessas capacidades, não uma nova forma de duplicá-las.</aside></div></section>`;const refMarker='<section><div class="slide">\n  <div class="topbar">\n    <div class="brand"><span class="dot"></span><span class="name">Referências</span>';let html=parts.join('').replace('Skill = workflow · Shared script = reutilização','Skill = workflow · shared = reutilização controlada').replace('<b>shared/assets/</b> locais','<b>assets/</b> locais').replace(refMarker,subagentSlide+'\n\n'+refMarker).replace('<span class="page">13</span></div>\n  <aside class="speaker"><b>Nota:</b> usar este slide final','<span class="page">14</span></div>\n  <aside class="speaker"><b>Nota:</b> usar este slide final').replace('<div class="formula">Obrigado — perguntas, críticas e sugestões são bem-vindas.</div>','<p class="small" style="margin:0"><a class="link" href="https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/multi-agent" target="_blank" rel="noopener noreferrer">Subagents / multi-agent guidance: https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/multi-agent</a></p><div class="formula">Obrigado — perguntas, críticas e sugestões são bem-vindas.</div>').replace('</head>','<link rel="stylesheet" href="theme-v3.css"><style>.page-13 .slide-body{gap:18px!important}.page-13 .card{padding:18px 20px!important;background:rgba(255,255,255,.028)!important;border-radius:12px!important}.page-13 .card:before{display:block!important}.page-13 .flow{max-width:1180px;margin-inline:auto}.page-13 .node{min-height:94px!important}.page-14 .slide-body{gap:18px!important}.page-14 .card{padding:17px 19px!important}.page-14 .link{font-size:11px}</style></head>').replace('</body>','<script src="layout-v3.js"><\/script></body>');document.open();document.write(html);document.close()}).catch(err=>{document.body.textContent='Não foi possível carregar a apresentação: '+err.message})</script></body></html>
