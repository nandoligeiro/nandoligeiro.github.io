<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skill Monorepo Architecture</title><style>html,body{margin:0;height:100%;display:grid;place-items:center;background:#0c0f14;color:#fff;font-family:system-ui,sans-serif}body{font-size:16px}</style></head><body>Carregando apresentação…<script>Promise.all(['part-01.txt','part-02.txt','part-03.txt'].map(p=>fetch(p).then(r=>{if(!r.ok)throw new Error(p);return r.text()}))).then(parts=>{const html=parts.join('').replace('Skill = workflow · Shared script = reutilização','Skill = workflow · shared = reutilização controlada').replace('<b>shared/assets/</b> locais','<b>assets/</b> locais');document.open();document.write(html);document.close()}).catch(err=>{document.body.textContent='Não foi possível carregar a apresentação: '+err.message})</script></body></html>
